<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>HS Drop Logger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0b0b;
      --bg2: #161010;
      --bg3: #1e1515;
      --border: #2a1e1e;
      --red: #c0392b;
      --red-dim: rgba(192,57,43,0.12);
      --red-border: rgba(192,57,43,0.3);
      --gold: #c9a84c;
      --gold-dim: rgba(201,168,76,0.1);
      --text: #ede8e0;
      --muted: #7a6a6a;
      --green: #34c97e;
      --green-dim: rgba(52,201,126,0.1);
      --amber: #f59e0b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      height: 48px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      flex-shrink: 0;
    }
    .logo-mark {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: var(--red-dim);
      border: 1px solid var(--red-border);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 10px; color: #e05c4a;
      letter-spacing: -0.5px;
    }
    header h1 { font-size: 13px; font-weight: 600; color: var(--text); }
    header .spacer { flex: 1; }
    #userBadge {
      font-size: 11px; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    #userBadge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
    }
    #btnLogout {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 11px; padding: 3px 8px;
      border-radius: 4px; transition: color 0.15s;
    }
    #btnLogout:hover { color: var(--text); }

    /* ── Screens ── */
    .screen { display: none; flex: 1; overflow: hidden; }
    .screen.active { display: flex; }

    /* ── Login screen ── */
    #screenLogin {
      align-items: center; justify-content: center;
      flex-direction: column; gap: 20px;
    }
    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 48px;
      text-align: center;
      width: 340px;
    }
    .login-card .icon {
      width: 56px; height: 56px; border-radius: 14px;
      background: var(--red-dim); border: 1px solid var(--red-border);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; font-size: 20px; font-weight: 900; color: #e05c4a;
    }
    .login-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .login-card p { color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
    #btnLogin {
      width: 100%;
      background: #5865F2;
      border: none; border-radius: 8px;
      color: #fff; font-size: 13px; font-weight: 600;
      padding: 11px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.15s;
    }
    #btnLogin:hover { opacity: 0.9; }
    #btnLogin:disabled { opacity: 0.5; cursor: default; }

    /* ── App screen ── */
    #screenApp { flex-direction: column; }

    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px 12px;
      gap: 20px;
      overflow-y: auto;
    }
    .sidebar-section h3 {
      font-size: 10px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.07em;
      margin-bottom: 8px;
    }

    /* Liga select */
    #leagueSelect {
      width: 100%;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px;
      padding: 7px 8px; font-size: 12px;
      appearance: none; cursor: pointer;
    }
    #leagueSelect:focus { outline: none; border-color: var(--red); }

    /* Monitor toggle */
    #btnToggleMonitor {
      width: 100%;
      border-radius: 7px;
      border: none; font-size: 12px; font-weight: 600;
      padding: 9px; cursor: pointer;
      transition: opacity 0.15s, background 0.2s;
    }
    #btnToggleMonitor.start { background: var(--red); color: #fff; }
    #btnToggleMonitor.stop  { background: var(--bg3); color: var(--amber); border: 1px solid var(--amber); }
    #btnToggleMonitor:disabled { opacity: 0.4; cursor: default; }

    /* Watchlist */
    #watchlistItems {
      display: flex; flex-direction: column; gap: 4px;
      margin-bottom: 8px;
    }
    .watch-chip {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 5px; padding: 5px 8px;
      font-size: 11px; color: var(--text);
    }
    .watch-chip .remove {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 14px; line-height: 1;
      padding: 0 2px; transition: color 0.15s;
    }
    .watch-chip .remove:hover { color: var(--red); }
    .add-watch {
      display: flex; gap: 4px;
    }
    #watchInput {
      flex: 1; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text);
      padding: 5px 7px; font-size: 11px;
    }
    #watchInput:focus { outline: none; border-color: var(--red); }
    #btnAddWatch {
      background: var(--red-dim); border: 1px solid var(--red-border);
      color: #e05c4a; border-radius: 5px;
      padding: 5px 8px; cursor: pointer; font-size: 13px;
      transition: background 0.15s;
    }
    #btnAddWatch:hover { background: var(--red); color: #fff; }

    /* ── Log panel ── */
    .log-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }
    .log-header span { font-size: 11px; color: var(--muted); }
    .status-dot {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px;
    }
    .status-dot .pulse {
      width: 7px; height: 7px; border-radius: 50%;
    }
    .status-dot.watching .pulse { background: var(--green); animation: pulse 1.5s infinite; }
    .status-dot.idle .pulse    { background: var(--muted); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    #btnClearLog {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 11px; padding: 3px 8px;
      border-radius: 4px; transition: color 0.15s;
    }
    #btnClearLog:hover { color: var(--text); }

    #logList {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .log-entry {
      display: flex; gap: 10px;
      padding: 7px 14px;
      border-bottom: 1px solid rgba(42,30,30,0.5);
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .log-entry .log-time { color: var(--muted); font-size: 10px; white-space: nowrap; margin-top: 1px; }
    .log-entry .log-msg  { flex: 1; line-height: 1.5; }
    .log-entry.success .log-msg { color: var(--green); }
    .log-entry.error   .log-msg { color: #e05c4a; }
    .log-entry.detect  .log-msg { color: var(--gold); }
    .log-entry.info    .log-msg { color: var(--muted); }

    .log-empty {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: var(--muted); font-size: 12px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo-mark">BP</div>
  <h1>HS Drop Logger</h1>
  <div class="spacer"></div>
  <div id="userBadge" style="display:none">
    <div class="dot"></div>
    <span id="userNameText"></span>
    <button id="btnLogout">Sair</button>
  </div>
</header>

<!-- Login -->
<div class="screen" id="screenLogin">
  <div class="login-card">
    <div class="icon">BP</div>
    <h2>HS Drop Logger</h2>
    <p>Faça login com sua conta Discord para sincronizar drops automaticamente com o HS Manager.</p>
    <button id="btnLogin">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
      </svg>
      Entrar com Discord
    </button>
  </div>
</div>

<!-- App principal -->
<div class="screen" id="screenApp">
  <div class="app-body">

    <!-- Sidebar -->
    <div class="sidebar">

      <div class="sidebar-section">
        <h3>Liga ativa</h3>
        <select id="leagueSelect">
          <option value="">Carregando...</option>
        </select>
      </div>

      <div class="sidebar-section">
        <h3>Monitor</h3>
        <button id="btnToggleMonitor" class="start" disabled>▶ Iniciar</button>
      </div>

      <div class="sidebar-section" style="flex:1">
        <h3>Watchlist</h3>
        <div id="watchlistItems"></div>
        <div class="add-watch">
          <input id="watchInput" type="text" placeholder="ex: Angelic" maxlength="60" />
          <button id="btnAddWatch">+</button>
        </div>
      </div>

    </div>

    <!-- Log -->
    <div class="log-panel">
      <div class="log-header">
        <div class="status-dot idle" id="statusDot">
          <div class="pulse"></div>
          <span id="statusText">Aguardando</span>
        </div>
        <button id="btnClearLog">Limpar</button>
      </div>
      <div id="logList">
        <div class="log-empty" id="logEmpty">Nenhuma atividade ainda. Inicie o monitor para começar.</div>
      </div>
    </div>

  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
