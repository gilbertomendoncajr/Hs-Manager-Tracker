<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="overlay-theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,500;0,600;0,700;0,800;1,700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 620px;
    background: transparent;
    overflow: hidden;
    font-family: 'Exo 2', 'Segoe UI', sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  #container {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 280ms ease, transform 280ms cubic-bezier(0.22,1,0.36,1);
  }
  #container.visible {
    opacity: 1;
    transform: translateY(0);
  }
  #container.hiding {
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 320ms ease, transform 320ms ease;
  }

  @media (prefers-reduced-motion: reduce) {
    #container, #container.visible, #container.hiding { transform: none; transition: opacity 200ms ease; }
  }
  html[data-reduce-motion="1"] #container, html[data-reduce-motion="1"] #container.visible, html[data-reduce-motion="1"] #container.hiding { transform: none; transition: opacity 200ms ease; }

  .sz-card {
    background: var(--ov-surface);
    border: 1px solid rgba(220,40,40,0.45);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(200,20,20,0.25), 0 0 0 1px rgba(220,40,40,0.12);
  }

  /* ── Header ── */
  .sz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 12px 6px;
    background: linear-gradient(90deg, rgba(180,20,20,0.30) 0%, rgba(180,20,20,0.10) 60%, transparent 100%);
    border-bottom: 1px solid rgba(220,40,40,0.28);
    gap: 8px;
  }
  .sz-icon {
    font-size: 13px;
    flex-shrink: 0;
    color: var(--sz-zone);
  }
  .sz-zone-name {
    flex: 1;
    font-size: 12px;
    font-weight: 800;
    font-style: italic;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--sz-zone);
    text-shadow: 0 0 12px rgba(255,60,60,0.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sz-timer {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.72);
    letter-spacing: 0.06em;
    font-family: 'Courier New', monospace;
    flex-shrink: 0;
  }

  /* ── Cols ── */
  .sz-cols {
    display: flex;
    gap: 0;
  }
  .sz-col {
    flex: 1;
    padding: 8px 10px 9px;
  }
  .sz-col + .sz-col {
    border-left: 1px solid var(--ov-hairline);
  }
  .sz-col-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .sz-col-label.pros { color: rgba(80,220,120,0.75); }
  .sz-col-label.cons { color: rgba(220,80,80,0.75); }

  /* ── Mod row ── */
  .sz-mod {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }
  .sz-mod:last-child { margin-bottom: 0; }

  .sz-mod-icon {
    width: 16px;
    height: 16px;
    object-fit: contain;
    flex-shrink: 0;
    opacity: 0.85;
  }
  .sz-mod-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-left: 2px;
  }
  .sz-mod-dot.pros { background: rgba(80,220,120,0.70); }
  .sz-mod-dot.cons { background: rgba(220,80,80,0.70); }

  .sz-mod-body { flex: 1; min-width: 0; }
  .sz-mod-name {
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sz-mod-name.pros { color: var(--sz-pros); }
  .sz-mod-name.cons { color: var(--sz-cons); }
  .sz-mod-desc {
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.42);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sz-mod-empty {
    font-size: 11px;
    color: rgba(255,255,255,0.20);
  }
</style>
<script src="motion-pref.js"></script>
</head>
<body>
<div id="container">
  <div class="sz-card">
    <div class="sz-header">
      <span class="sz-icon">⚔</span>
      <span class="sz-zone-name" id="szZoneName">—</span>
      <span class="sz-timer" id="szTimer"></span>
    </div>
    <div class="sz-cols">
      <div class="sz-col">
        <div class="sz-col-label pros">▲ PROS</div>
        <div id="szPros"></div>
      </div>
      <div class="sz-col">
        <div class="sz-col-label cons">▼ CONS</div>
        <div id="szCons"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SATANIC_BUFFS = {
  1:  ['Loot Goblin I',      '+1 Max Loot por Inimigo Morto',              '+1 Max Loot per Enemy Killed'],
  2:  ['Loot Goblin II',     '+2 Max Loot por Inimigo Morto',              '+2 Max Loot per Enemy Killed'],
  3:  ['Rune Master',        '+15% Chance de Drop de Runas',               '+15% Rune Drop Chance'],
  4:  ['Gold Hunger',        '+40% Ouro de Monstros Mortos',               '+40% Gold from Slain Monsters'],
  5:  ['Heroic Windfall',    '+3% Chance de Drop Heroic',                  '+3% Heroic Drop Chance'],
  6:  ['Angelic Fortune',    '+25% Chance de Drop Angelic',                '+25% Angelic Drop Chance'],
  7:  ["Zephy's Grace",      '+50% Velocidade de Movimento',               '+50% Movement Speed'],
  8:  ['Fury of Tempest',    '+60% Velocidade de Ataque',                  '+60% Attack Speed'],
  9:  ['Rapid Casting',      '+60% Velocidade de Conjuração',              '+60% Cast Speed'],
  10: ['Onslaught',          '+100% Dano de Ataque',                       '+100% Attack Damage'],
  11: ['Nether Surge',       '+40% Dano de Magia',                         '+40% Spell Damage'],
  12: ['Relic Keepers',      '2% Chance de Relic ao Matar Ancião',         '2% Relic Chance on Elder Kill'],
  13: ["Goblin's Greed",     '0.5% Chance de Goblin do Tesouro',           '0.5% Treasure Goblin Chance'],
  14: ['Artifact Digger',    '+55% Magic Find',                            '+55% Magic Find'],
  15: ['Artifact Seeker',    '+110% Magic Find',                           '+110% Magic Find'],
  16: ['Artifact Excavator', '+170% Magic Find',                           '+170% Magic Find'],
  17: ['Recruit',            '+10% Ganho de XP',                           '+10% XP Gain'],
  18: ['Combat Training',    '+15% Ganho de XP',                           '+15% XP Gain'],
  19: ['Battle Scarred',     '+20% Ganho de XP',                           '+20% XP Gain'],
  20: ['Clairvoyance',       '+100% em toda recuperação',                  '+100% to all recovery'],
  21: ['Aftermath',          '3% Chance de Invocar Legião na Morte',       '3% Chance to Summon Legion on Death'],
  22: ['Deep Cuts',          '+200% Dano de Golpe Crítico',                '+200% Critical Strike Damage'],
  23: ['Old Town',           '+15% Chance de Packs Antigos',               '+15% Old Packs Chance'],
  24: ['Terror Zone',        '+25% Chance de Packs Antigos',               '+25% Old Packs Chance'],
  25: ['Fields of Carnage',  '+30% Chance de Packs Antigos',               '+30% Old Packs Chance'],
}
const SATANIC_DEBUFFS = [
  ["Dusk's Shroud",      '-20% Raio de Luz',                      '-20% Light Radius'],
  ['Elemental Erosion',  '-75% Todas as Resistências',            '-75% All Resistances'],
  ['Sundered Armor',     '+25% Dano Recebido',                    '+25% Damage Taken'],
  ['Vitality Drain',     '-25% Vida',                              '-25% Life'],
  ['Essence Drain',      '-25% Mana',                              '-25% Mana'],
  ['Abyssal Gloom',      '+100% Escuridão',                        '+100% Darkness'],
  ['Skill Debilitation', '-10% Todas as Skills',                   '-10% All Skills'],
  ['Weakening Essence',  '-20% Todos os Atributos',                '-20% All Attributes'],
  ['Lifeflow Starvation','Regeneração reduzida',                   'Reduced Regeneration'],
  ['Sanguine Impairment','-75% Roubo de Vida',                     '-75% Life Steal'],
  ['Arcane Impairment',  '-75% Roubo de Mana',                     '-75% Mana Steal'],
  ['Consumed Time',      '-25% Recuperação de Cooldown',           '-25% Cooldown Recovery'],
  ['Absolute Limbo',     '-50% Recuperação de Cooldown',           '-50% Cooldown Recovery'],
  ['Boulder Fall',       '3% Chance de Boulder na Morte',          '3% Boulder Chance on Death'],
  ['Lingering Evil',     '-25% Velocidade de Movimento',           '-25% Movement Speed'],
  ['Fatal Wounds',       '10% Chance de Dano Duplo dos Monstros',  '10% Chance of Double Damage from Monsters'],
  ['Bloated Veins',      '+70% Vida dos Monstros',                 '+70% Monster Life'],
  ['Abnormal Dwelling',  '+130% Vida dos Monstros',                '+130% Monster Life'],
  ['Colossal Bloating',  '+200% Vida dos Monstros',                '+200% Monster Life'],
  ['Necrosis',           '1% de Vida drenada por segundo',         '1% Life Drained per Second'],
  ['Venomous Presence',  '+200% Duração de Veneno',                '+200% Poison Duration'],
  ['Flaming Agony',      'Nova de Fogo na morte dos monstros',     'Fire Nova on monster death'],
  ['Unholy Agility',     'Monstros mais rápidos e agressivos',     'Monsters are faster and more aggressive'],
  ['Broken Armor',       'Você não pode bloquear ataques',         'You cannot block attacks'],
  ['Hemorrhage',         'Ataques de monstros causam sangramento', 'Monster attacks cause bleeding'],
  ['Crippling Slow',     'Ataques infligem 50% de lentidão',       'Attacks inflict 50% slow'],
]
let _overlayLang = 'pt'
const ZONE_AREAS = {
  1: ['Outskirts of Inoya','Fields of Battle','The Pumpkin Patch','Woodhill Plains',"King's Garden",'Witching River'],
  2: ['Crystal Village','Chilling Lake','Arctic Tundra','Snowy Mountains','The Glacial Trail'],
  3: ['Corrupted Oasis','Dry Hills',"Mos'Arathim Desert",'Pyramid Level 1','Pyramid Level 2','Curacan Hollow'],
  4: ['Old Mining Village','The Highland Mines','Corrupted Cave','The Nightmare',"The Devil's Breach"],
  5: ['Mt. Fuji','Misty Swamp','Fuji Coast','Sea of Karponia','Temple of Zamjo'],
  6: ['Highland Graveyard','The Cathedral','Prison Dungeon','Steam Train','The Depths of Hell'],
  7: ['Deep Space','Event Horizon','The Black Hole','Parallel Dimension','Subconscious Mind','Shattered Realm'],
  8: ['Forest of the Slain','Flooded Plains','Forgotten Caves','Camp of Souls','Helheim'],
  9: ['Abyss Jungle','Shipwreck Cove','Tormented Reef','Boreal Island','Volcanic Island','Abyss Realm'],
}

const DEFAULT_TTL = 18000
const container = document.getElementById('container')
const szZoneName = document.getElementById('szZoneName')
const szPros     = document.getElementById('szPros')
const szCons     = document.getElementById('szCons')
const szTimer    = document.getElementById('szTimer')

let hideTimer   = null
let tickInterval = null
let hideAt      = 0

function fmtZone(raw) {
  const parts = String(raw).split('_')
  if (parts.length >= 3) {
    const act = parseInt(parts[parts.length - 2], 10)
    const idx = parseInt(parts[parts.length - 1], 10)
    if (!isNaN(act) && !isNaN(idx) && act > 0) {
      const areas = ZONE_AREAS[act]
      if (areas && idx >= 1 && idx <= areas.length) return `Act ${act} — ${areas[idx - 1]}`
      return `Act ${act} — Area ${idx}`
    }
  }
  return String(raw)
}

function renderBuff(id) {
  const b = SATANIC_BUFFS[id]
  const name = b ? b[0] : `Buff ${id}`
  const desc = b ? (_overlayLang === 'en' ? b[2] : b[1]) : ''
  const iconSrc = `assets/icons/buffs/${id}.png`
  return `<div class="sz-mod">
    <img class="sz-mod-icon" src="${iconSrc}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'sz-mod-dot pros'}))">
    <div class="sz-mod-body">
      <div class="sz-mod-name pros">${name}</div>
      ${desc ? `<div class="sz-mod-desc">${desc}</div>` : ''}
    </div>
  </div>`
}

function renderDebuff(id) {
  const d = SATANIC_DEBUFFS[id - 1]
  const name = d ? d[0] : `Debuff ${id}`
  const desc = d ? (_overlayLang === 'en' ? d[2] : d[1]) : ''
  return `<div class="sz-mod">
    <span class="sz-mod-dot cons"></span>
    <div class="sz-mod-body">
      <div class="sz-mod-name cons">${name}</div>
      ${desc ? `<div class="sz-mod-desc">${desc}</div>` : ''}
    </div>
  </div>`
}

function startTick() {
  clearInterval(tickInterval)
  tickInterval = setInterval(() => {
    const rem = Math.max(0, Math.ceil((hideAt - Date.now()) / 1000))
    szTimer.textContent = rem > 0 ? `${rem}s` : ''
    if (rem === 0) clearInterval(tickInterval)
  }, 500)
}

function showSatanic(data) {
  clearTimeout(hideTimer)
  clearInterval(tickInterval)

  if (!data || !data.zone) {
    hide()
    return
  }

  if (data.lang) _overlayLang = data.lang
  szZoneName.textContent = fmtZone(data.zone)

  const buffIds   = data.buffs   || []
  const debuffIds = data.debuffs || []
  szPros.innerHTML = buffIds.length
    ? buffIds.map(renderBuff).join('')
    : '<div class="sz-mod-empty">—</div>'
  szCons.innerHTML = debuffIds.length
    ? debuffIds.map(renderDebuff).join('')
    : '<div class="sz-mod-empty">—</div>'

  container.classList.remove('hiding')
  requestAnimationFrame(() => {
    requestAnimationFrame(() => container.classList.add('visible'))
  })

  const ttl = data.ttl > 0 ? data.ttl * 1000 : DEFAULT_TTL
  hideAt = Date.now() + ttl
  startTick()
  hideTimer = setTimeout(hide, ttl)
}

function hide() {
  clearInterval(tickInterval)
  container.classList.add('hiding')
  container.classList.remove('visible')
  szTimer.textContent = ''
  setTimeout(() => container.classList.remove('hiding'), 340)
}

if (window.__HSoverlay && window.__HSoverlay.onSatanic) {
  window.__HSoverlay.onSatanic((data) => showSatanic(data))
} else {
  // Preview mode: show mock data
  document.body.style.background = 'var(--ov-preview-bg)'
  document.body.style.padding = '16px'
  showSatanic({
    zone: 'Satanic_5_5',
    buffs: [1, 4, 6, 14],
    debuffs: [2, 4, 17],
  })
}
</script>
</body>
</html>
