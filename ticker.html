<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,500;0,700;0,800;1,800&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 578px;
    background: transparent;
    overflow: hidden;
    font-family: 'Exo 2', 'Segoe UI', sans-serif;
    -webkit-user-select: none;
    user-select: none;
    padding: 3px 0;
  }

  body.preview-mode {
    background: #0d0b18;
    padding: 16px;
    width: 640px;
    min-height: 100vh;
  }

  .preview-label {
    display: none;
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    margin-bottom: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: monospace;
  }
  body.preview-mode .preview-label { display: block; }

  /* ── Entry ────────────────────────────────────── */
  .entry {
    display: flex;
    align-items: stretch;
    height: 38px;
    margin-bottom: 5px;
    opacity: 0;
    transform: translateX(-18px);
    animation: slideIn 220ms cubic-bezier(0.22,1,0.36,1) forwards;
    transition: opacity 450ms ease, transform 450ms ease;
    border-radius: 3px;
    overflow: hidden;
  }

  .entry.fading {
    opacity: 0 !important;
    transform: translateX(-10px) !important;
  }

  @keyframes slideIn {
    to { opacity: 1; transform: translateX(0); }
  }

  /* Barra lateral colorida */
  .bar {
    width: 4px;
    flex-shrink: 0;
  }

  /* Tag de raridade */
  .tag-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px;
    flex-shrink: 0;
    background: rgba(5, 3, 12, 0.9);
    border-right: 1px solid rgba(255,255,255,0.07);
    min-width: 74px;
  }

  .tag {
    font-size: 11px;
    font-weight: 800;
    font-style: italic;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Centro: nome do item */
  .center {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 12px;
    background: rgba(5, 3, 12, 0.84);
    gap: 2px;
  }

  .iname {
    font-size: 14px;
    font-weight: 700;
    color: #f5eedd;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1;
  }

  .who {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    white-space: nowrap;
    line-height: 1;
  }

  /* Tier à direita */
  .tier-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 11px;
    background: rgba(5, 3, 12, 0.9);
    border-left: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
  }

  .tier {
    font-size: 12px;
    font-weight: 800;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.04em;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 2px 6px;
    border-radius: 2px;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="preview-label">◈ HS Drop Overlay — Preview Mode</div>
<div id="list"></div>

<script>
  const COLORS = {
    Satanic: '#e03030',
    Set:     '#3ec83e',
    Heroic:  '#00e8a0',
    Angelic: '#f0e855',
    Unholy:  '#d94880',
    Blessed: '#9b7af0',
  };

  const MAX = 5;
  const TTL = 9000;
  const list = document.getElementById('list');
  const entries = [];

  function addDrop(drop) {
    const color = COLORS[drop.rarity] || '#d4b87a';
    const tierStr = drop.tier ? drop.tier.toString().replace(/^T\d*/i, '') || drop.tier : '';

    const div = document.createElement('div');
    div.className = 'entry';
    // Cor em hex → rgba helper
    const hex = color.replace('#','');
    const r = parseInt(hex.slice(0,2),16);
    const g = parseInt(hex.slice(2,4),16);
    const b = parseInt(hex.slice(4,6),16);
    const rgb = `${r},${g},${b}`;

    div.innerHTML = `
      <div class="bar" style="background:${color};box-shadow:0 0 8px ${color}99"></div>
      <div class="tag-wrap" style="background:linear-gradient(90deg,rgba(${rgb},0.22) 0%,rgba(${rgb},0.08) 100%)">
        <span class="tag" style="color:${color};text-shadow:0 0 12px ${color}88">${drop.rarity || '?'}</span>
      </div>
      <div class="center" style="background:linear-gradient(90deg,rgba(${rgb},0.12) 0%,rgba(5,3,12,0.75) 60%)">
        <span class="iname" style="text-shadow:0 0 18px rgba(${rgb},0.5)">${drop.name || '?'}</span>
        ${drop.charName ? `<span class="who">↓ ${drop.charName}</span>` : ''}
      </div>
      ${tierStr ? `
      <div class="tier-wrap" style="background:rgba(5,3,12,0.82)">
        <span class="tier" style="color:${color};border-color:${color}44">${tierStr}</span>
      </div>` : ''}
    `;

    list.prepend(div);
    const entry = { div, timer: null };
    entries.unshift(entry);

    while (entries.length > MAX) {
      const old = entries.pop();
      clearTimeout(old.timer);
      old.div.remove();
    }

    entry.timer = setTimeout(() => {
      div.classList.add('fading');
      setTimeout(() => {
        div.remove();
        const i = entries.indexOf(entry);
        if (i >= 0) entries.splice(i, 1);
      }, 480);
    }, TTL);
  }

  if (window.__HSoverlay) {
    window.__HSoverlay.onDrop((drop) => addDrop(drop));
  }

  if (!window.__HSoverlay) {
    document.body.classList.add('preview-mode');
    const MOCKS = [
      { name: 'Satanic Blade of Doom',    rarity: 'Satanic', tier: 'SS', charName: 'danilomac'  },
      { name: 'Angelic Bow of Heaven',    rarity: 'Angelic', tier: 'S',  charName: 'vipper8740' },
      { name: 'Unholy Staff of Fire',     rarity: 'Unholy',  tier: 'A',  charName: 'masterxds'  },
      { name: 'Set Ring of Power',        rarity: 'Set',     tier: 'B',  charName: 'cazumabh'   },
      { name: 'Heroic Armor of the Gods', rarity: 'Heroic',  tier: 'C',  charName: 'luctz'      },
      { name: 'Blessed Shield of Faith',  rarity: 'Blessed', tier: 'D',  charName: 'mota11239'  },
    ];
    let i = 0;
    function fireNext() {
      addDrop(MOCKS[i % MOCKS.length]);
      i++;
      setTimeout(fireNext, 1800);
    }
    setTimeout(fireNext, 400);
  }
</script>
</body>
</html>
